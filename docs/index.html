        // --- Logic ---
        let currentLang = 'en';
        let activeSection = 'intro';

        function setLang(lang) {
            currentLang = lang;
            
            // Update buttons
            document.getElementById('btn-en').className = lang === 'en' 
                ? "flex-1 py-1.5 text-sm font-medium rounded-md transition-all shadow-sm bg-white text-slate-900 border border-slate-200" 
                : "flex-1 py-1.5 text-sm font-medium rounded-md transition-all text-slate-500 hover:text-slate-900";
                
            document.getElementById('btn-fr').className = lang === 'fr' 
                ? "flex-1 py-1.5 text-sm font-medium rounded-md transition-all shadow-sm bg-white text-slate-900 border border-slate-200" 
                : "flex-1 py-1.5 text-sm font-medium rounded-md transition-all text-slate-500 hover:text-slate-900";

            renderNav();
            renderContent(activeSection);
        }

        function renderNav() {
            const navContainer = document.getElementById('nav-container');
            navContainer.innerHTML = '';
            
            content[currentLang].forEach(section => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-6 py-2.5 text-sm font-medium transition-colors border-l-2 ${activeSection === section.id ? 'bg-brand-50 text-brand-600 border-brand-500' : 'text-slate-600 hover:bg-slate-50 border-transparent hover:text-slate-900'}`;
                btn.textContent = section.title;
                btn.onclick = () => {
                    activeSection = section.id;
                    renderNav();
                    renderContent(section.id);
                    if(window.innerWidth < 768) toggleSidebar();
                };
                navContainer.appendChild(btn);
            });
        }

        function renderContent(sectionId) {
            const section = content[currentLang].find(s => s.id === sectionId);
            const contentArea = document.getElementById('content-area');
            
            // Fade out effect could be added here
            contentArea.innerHTML = section.html;
            window.scrollTo(0,0);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const isHidden = sidebar.classList.contains('-translate-x-full');

            if (isHidden) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        setLang('en');

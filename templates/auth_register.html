{% extends "dashboard_layout.html" %}

{% block title %}Inscription{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
            <div class="text-center mb-8">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Swiftly" class="w-12 h-12 rounded-md object-cover mx-auto block">
                <h1 class="text-3xl font-bold text-slate-900 mb-2">Créer un compte</h1>
                <p class="text-slate-600">Commencez à déployer vos sites gratuitement</p>
            </div>

            <form method="POST" action="/auth/register" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-2">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-500 focus:ring-opacity-20 transition-colors outline-none"
                        placeholder="votre@email.com"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-2">
                        Mot de passe 
                        <span class="text-slate-500 font-normal">(min. 6 caractères)</span>
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        minlength="6"
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-500 focus:ring-opacity-20 transition-colors outline-none"
                        placeholder="••••••••"
                    >
                </div>

                <button 
                    type="submit"
                    class="w-full px-6 py-3.5 text-base font-semibold text-white bg-brand-600 rounded-xl hover:bg-brand-700 transition-all shadow-lg shadow-brand-500/20 hover:shadow-xl hover:shadow-brand-500/30"
                >
                    Créer mon compte
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-slate-600 text-sm">
                    Déjà un compte ?
                    <a href="/auth/login" class="text-brand-600 hover:text-brand-700 font-semibold">
                        Se connecter
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "dashboard_layout.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<script>
function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);
    const icon = button.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}

// Password strength indicator
document.addEventListener('DOMContentLoaded', function() {
    const passwordInput = document.getElementById('reg-password');
    if (passwordInput) {
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            const strength = document.getElementById('password-strength');
            const hint = document.getElementById('password-hint');
            
            let score = 0;
            if (password.length >= 6) score += 25;
            if (password.length >= 10) score += 25;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score += 25;
            if (/\d/.test(password)) score += 15;
            if (/[^a-zA-Z0-9]/.test(password)) score += 10;
            
            strength.style.width = score + '%';
            
            if (score < 40) {
                hint.textContent = 'Weak - Add uppercase letters and numbers';
                hint.className = 'text-xs text-red-400 mt-1';
            } else if (score < 70) {
                hint.textContent = 'Medium - Add special characters';
                hint.className = 'text-xs text-yellow-400 mt-1';
            } else {
                hint.textContent = 'Strong - Excellent password!';
                hint.className = 'text-xs text-green-400 mt-1';
            }
        });
    }
});
</script>

<div class="min-h-[80vh] flex items-center justify-center py-12 px-4">
    <div class="max-w-5xl w-full">
        <div class="flex flex-col lg:flex-row justify-center gap-8">
            <!-- Login -->
            <div class="flex-1 bg-gradient-to-br from-white to-slate-50 rounded-2xl shadow-2xl p-8 border border-slate-200 hover:shadow-3xl transition-all duration-300">
                <div class="text-center mb-10">
                    <div class="relative inline-block mb-4">
                        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Swiftly" class="w-16 h-16 rounded-2xl object-cover mx-auto shadow-lg">
                        <div class="absolute -bottom-1 -right-1 w-5 h-5 bg-green-500 rounded-full border-2 border-white"></div>
                    </div>
                    <h1 class="text-3xl font-bold text-slate-900 mb-2 bg-gradient-to-r from-brand-600 to-brand-500 bg-clip-text text-transparent">Welcome back!</h1>
                    <p class="text-slate-500 text-sm">Sign in to continue</p>
                </div>

                <form method="POST" action="/auth/login" class="space-y-5">
                    <!-- Email -->
                    <div class="group">
                        <label for="login-email" class="block text-sm font-semibold text-slate-700 mb-2 transition-colors group-focus-within:text-brand-600">
                            <i class="fas fa-envelope mr-2 text-brand-500"></i>Email address
                        </label>
                        <div class="relative">
                            <input 
                                type="email" 
                                id="login-email" 
                                name="email" 
                                required
                                class="w-full px-5 py-3.5 pl-11 rounded-xl border-2 border-slate-200 focus:border-brand-500 focus:ring-4 focus:ring-brand-500 focus:ring-opacity-10 transition-all outline-none bg-white hover:border-slate-300"
                                placeholder="name@example.com"
                            >
                            <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-brand-500 transition-colors"></i>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="group">
                        <div class="flex items-center justify-between mb-2">
                            <label for="login-password" class="block text-sm font-semibold text-slate-700 transition-colors group-focus-within:text-brand-600">
                                <i class="fas fa-lock mr-2 text-brand-500"></i>Password
                            </label>
                        </div>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="login-password" 
                                name="password" 
                                required
                                class="w-full px-5 py-3.5 pl-11 pr-11 rounded-xl border-2 border-slate-200 focus:border-brand-500 focus:ring-4 focus:ring-brand-500 focus:ring-opacity-10 transition-all outline-none bg-white hover:border-slate-300"
                                placeholder="••••••••••"
                            >
                            <i class="fas fa-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-brand-500 transition-colors"></i>
                            <button type="button" onclick="togglePassword('login-password', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>



                    <!-- Button -->
                    <button 
                        type="submit"
                        class="w-full px-6 py-4 text-base font-bold text-white bg-gradient-to-r from-brand-600 to-brand-500 rounded-xl hover:from-brand-700 hover:to-brand-600 transition-all shadow-lg shadow-brand-500/30 hover:shadow-xl hover:shadow-brand-500/40 hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2 group"
                    >
                        <span>Sign In</span>
                        <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                    </button>
                </form>

                <!-- Forgot password -->
                <div class="mt-4 text-center">
                    <a href="{{ url_for('auth_web.forgot_password_page') }}" class="text-sm text-brand-600 hover:text-brand-700 font-medium">
                        Forgot password?
                    </a>
                </div>

                <!-- Divider -->
                <div class="mt-6 flex items-center gap-3">
                    <div class="h-px bg-slate-200 flex-1"></div>
                    <span class="text-xs text-slate-400 font-medium">Secured by Swiftly</span>
                    <div class="h-px bg-slate-200 flex-1"></div>
                </div>
            </div>

            <!-- Separator -->
            <div class="hidden lg:flex flex-col items-center justify-center gap-4 text-slate-400 px-4">
                <div class="w-px h-full bg-gradient-to-b from-transparent via-slate-300 to-transparent"></div>
                <div class="bg-white rounded-full p-3 shadow-md border border-slate-200">
                    <span class="text-sm font-bold text-brand-600">OU</span>
                </div>
                <div class="w-px h-full bg-gradient-to-b from-transparent via-slate-300 to-transparent"></div>
            </div>

            <!-- Mobile separator -->
            <div class="lg:hidden flex items-center gap-4 text-slate-400">
                <div class="h-px bg-gradient-to-r from-transparent via-slate-300 to-transparent flex-1"></div>
                <div class="bg-white rounded-full px-4 py-2 shadow-md border border-slate-200">
                    <span class="text-sm font-bold text-brand-600">OU</span>
                </div>
                <div class="h-px bg-gradient-to-r from-transparent via-slate-300 to-transparent flex-1"></div>
            </div>

            <!-- Register -->
            <div class="flex-1 bg-gradient-to-br from-white to-slate-50 rounded-2xl shadow-2xl p-8 border border-slate-200 hover:shadow-3xl transition-all duration-300">
                <div class="text-center mb-10">
                    <div class="relative inline-block mb-4">
                        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Swiftly" class="w-16 h-16 rounded-2xl object-cover mx-auto shadow-lg border-2 border-brand-100">
                        <div class="absolute -bottom-1 -right-1 w-5 h-5 bg-brand-500 rounded-full border-2 border-white flex items-center justify-center">
                            <i class="fas fa-plus text-white text-xs"></i>
                        </div>
                    </div>
                    <h1 class="text-3xl font-bold text-slate-900 mb-2 bg-gradient-to-r from-brand-600 to-brand-500 bg-clip-text text-transparent">Join us</h1>
                    <p class="text-slate-500 text-sm">Create your free account</p>
                </div>

                <form method="POST" action="/auth/register" class="space-y-5">
                    <!-- Email -->
                    <div class="group">
                        <label for="login-email" class="block text-sm font-semibold text-slate-700 mb-2 transition-colors group-focus-within:text-brand-600">
                            <i class="fas fa-envelope mr-2 text-brand-500"></i>Email address
                        </label>
                        <div class="relative">
                            <input 
                                type="email" 
                                id="reg-email" 
                                name="email" 
                                required
                                class="w-full px-5 py-3.5 pl-11 rounded-xl border-2 border-slate-200 focus:border-brand-500 focus:ring-4 focus:ring-brand-500 focus:ring-opacity-10 transition-all outline-none bg-white hover:border-slate-300"
                                placeholder="name@example.com"
                            >
                            <i class="fas fa-user-plus absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-brand-500 transition-colors"></i>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="group">
                        <label for="reg-password" class="block text-sm font-semibold text-slate-700 mb-2 transition-colors group-focus-within:text-brand-600">
                            <i class="fas fa-shield-halved mr-2 text-brand-500"></i>Password 
                            <span class="text-slate-500 font-normal text-xs">(min. 6 characters)</span>
                        </label>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="reg-password" 
                                name="password" 
                                required
                                minlength="6"
                                class="w-full px-5 py-3.5 pl-11 pr-11 rounded-xl border-2 border-slate-200 focus:border-brand-500 focus:ring-4 focus:ring-brand-500 focus:ring-opacity-10 transition-all outline-none bg-white hover:border-slate-300"
                                placeholder="••••••••••"
                            >
                            <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-brand-500 transition-colors"></i>
                            <button type="button" onclick="togglePassword('reg-password', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Button -->
                    <button 
                        type="submit"
                        class="w-full px-6 py-4 text-base font-bold text-white bg-gradient-to-r from-slate-900 to-slate-800 rounded-xl hover:from-black hover:to-slate-900 transition-all shadow-lg shadow-slate-900/20 hover:shadow-xl hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2 group"
                    >
                        <i class="fas fa-rocket text-brand-400"></i>
                        <span>Create my account</span>
                        <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                    </button>
                </form>

                <!-- Divider -->
                <div class="mt-6 flex items-center gap-3">
                    <div class="h-px bg-slate-200 flex-1"></div>
                    <span class="text-xs text-slate-400 font-medium">Secured by Swiftly</span>
                    <div class="h-px bg-slate-200 flex-1"></div>
                </div>
            </div>
        </div> 
    </div>
</div>
{% endblock %}

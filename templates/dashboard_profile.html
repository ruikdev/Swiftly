{% extends "dashboard_layout.html" %}

{% block title %}Profile{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-8">
        <a href="/dashboard" class="inline-flex items-center gap-2 text-slate-600 hover:text-brand-600 mb-4">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            Back to dashboard
        </a>
        <h1 class="text-3xl font-bold text-slate-900 mb-2">My Profile</h1>
        <p class="text-slate-600">Manage your account details</p>
    </div>

    <div class="grid gap-6">
        <!-- Account details -->
        <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-6">
            <h2 class="text-xl font-bold text-slate-900 mb-4">Account information</h2>
            <div class="space-y-3">
                <div>
                    <label class="text-sm font-medium text-slate-600">Email</label>
                    <p class="text-slate-900 font-medium">{{ email }}</p>
                </div>
                <div>
                    <label class="text-sm font-medium text-slate-600">Number of sites</label>
                    <p class="text-slate-900 font-medium">{{ site_count }}</p>
                </div>
            </div>
        </div>

        <!-- Change email -->
        <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-6">
            <h2 class="text-xl font-bold text-slate-900 mb-4">Change email</h2>
            <form method="POST" action="/dashboard/profile/update-email" class="space-y-4">
                <div>
                    <label for="new_email" class="block text-sm font-medium text-slate-700 mb-2">New email</label>
                    <input 
                        type="email" 
                        id="new_email" 
                        name="new_email" 
                        required
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-500 focus:ring-opacity-20 transition-colors outline-none"
                    >
                </div>
                <div>
                    <label for="password_email" class="block text-sm font-medium text-slate-700 mb-2">Current password</label>
                    <input 
                        type="password" 
                        id="password_email" 
                        name="password" 
                        required
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-500 focus:ring-opacity-20 transition-colors outline-none"
                    >
                </div>
                <button 
                    type="submit"
                    class="px-6 py-3 text-base font-semibold text-white bg-brand-600 rounded-xl hover:bg-brand-700 transition-all shadow-lg shadow-brand-500/20"
                >
                    Update email
                </button>
            </form>
        </div>

        <!-- Change password -->
        <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-6">
            <h2 class="text-xl font-bold text-slate-900 mb-4">Change password</h2>
            <form method="POST" action="/dashboard/profile/update-password" class="space-y-4">
                <div>
                    <label for="old_password" class="block text-sm font-medium text-slate-700 mb-2">Old password</label>
                    <input 
                        type="password" 
                        id="old_password" 
                        name="old_password" 
                        required
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-500 focus:ring-opacity-20 transition-colors outline-none"
                    >
                </div>
                <div>
                    <label for="new_password" class="block text-sm font-medium text-slate-700 mb-2">New password (min. 6 characters)</label>
                    <input 
                        type="password" 
                        id="new_password" 
                        name="new_password" 
                        required
                        minlength="6"
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-500 focus:ring-opacity-20 transition-colors outline-none"
                    >
                </div>
                <button 
                    type="submit"
                    class="px-6 py-3 text-base font-semibold text-white bg-brand-600 rounded-xl hover:bg-brand-700 transition-all shadow-lg shadow-brand-500/20"
                >
                    Update password
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
